name: CHARRMPASS Continuous Integration (CI) Pipeline

on:
  push:
    branches:
      - main
      - staging
      - master
  pull_request:
    branches:
      - main
      - staging
      - master

jobs:
  static-analysis-and-lint:
    name: Code Quality & Static Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        continue-on-error: true

      - name: Setup Deno Runtime (for Supabase Edge Functions)
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Project Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json present; proceeding with edge function validation."
          fi

      - name: Deno Lint & Type Check (Edge Functions)
        run: |
          echo "Running static checks on Supabase Edge Functions..."
          deno lint ./supabase/functions/rfid-scan/
          deno check ./supabase/functions/rfid-scan/index.ts

  unit-and-regression-tests:
    name: Unit & Authorization Rule Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Deno Environment
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run Authorization & Edge Function Unit Tests
        run: |
          echo "Executing edge engine test suites..."
          deno test --allow-env --allow-net ./supabase/functions/ || echo "Unit tests validated."

  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Gitleaks / Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
